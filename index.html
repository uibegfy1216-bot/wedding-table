<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <title>婚礼桌位查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #faf7f2;
            color: #333;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .heart {
            font-size: 48px;
            margin-bottom: 20px;
            line-height: 1;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 40px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .notice {
            font-size: 15px;
            color: #666;
            line-height: 1.8;
        }
        .notice .highlight {
            color: #c48a6b;
            font-weight: 600;
        }
        .divider {
            width: 40px;
            height: 2px;
            background: #e8ddd0;
            margin: 24px auto;
            border-radius: 1px;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">&#x1F492;</div>
        <h1>婚礼桌位查询</h1>
        <p class="subtitle">Wedding Table Finder</p>
        
        <div class="card">
            <p class="notice">
                亲爱的宾客，您好！<br><br>
                <span class="highlight">桌位查询系统即将上线</span><br>
                请婚礼当天扫码查询您的桌位
            </p>
            <div class="divider"></div>
            <p class="notice" style="font-size: 13px; color: #999;">
                如有疑问，请联系新人或现场工作人员
            </p>
        </div>
        
        <p class="footer">感谢您的到来，期待与您共庆美好时刻 &#x2728;</p>
    </div>
</body>
</html>
