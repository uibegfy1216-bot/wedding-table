            margin: 0 auto;

            position: relative;
            background: #fff;

            padding: 14px 0;

            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 8px;

        .results {

        .result-card {

        .result-card .name { font-size: 20px; font-weight: 600; color: #5a3e36; margin-bottom: 12px; }

        input.addEventListener('input', () => {

            if (query.length >= 1) {
                doSearch(query);
            } else {
                results.innerHTML = '';
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });

        function search() {
            const query = input.value.trim();
            if (!query) return;
            doSearch(query);
        }

        function doSearch(query) {
            const q = query.toLowerCase();
            const matched = guests.filter(g => g.name.toLowerCase().includes(q));

            if (matched.length === 0) {
                results.innerHTML = '<div class="empty-state">未找到该姓名，请检查输入是否正确</div>';
                return;
            }

            results.innerHTML = matched.map(g => `
                <div class="result-card">
                    <div class="name">${g.name}</div>
                    <div class="table-tag">${g.table}</div>
                </div>
            `).join('');
